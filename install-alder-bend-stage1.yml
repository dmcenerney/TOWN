name: Install Alder Bend — Stage 1

# SINGLE-FILE STAGE 1 INSTALLER
#
# This workflow contains the complete Alder Bend Stage 1 repository payload.
#
# USE:
#   1. In GitHub, create:
#        .github/workflows/install-alder-bend-stage1.yml
#   2. Paste/upload this entire file and commit it.
#   3. Go to Settings -> Actions -> General.
#      Under "Workflow permissions", select "Read and write permissions".
#   4. Go to Actions -> "Install Alder Bend — Stage 1".
#   5. Tap/click "Run workflow".
#
# WHAT IT DOES:
#   - Reconstructs the complete Stage 1 project in the repository.
#   - Preserves the CI workflow source files under ci/workflows/.
#     (A normal GitHub Actions token is commonly blocked from creating or
#      replacing other .github/workflows files.)
#   - Installs Node 22 dependencies.
#   - Runs strict typechecking.
#   - Runs the complete 65-test suite.
#   - Runs a 1,000-day soak simulation.
#   - Commits and pushes Stage 1.
#
# STAGE 1 ADDS:
#   - Authored Alder Bend map
#   - 27 physical buildings
#   - Navigation graph and deterministic routing
#   - Continuous movement segments and position interpolation
#   - Departure/arrival events
#   - Occupancy consistency
#   - Spatial and anti-teleportation invariants
#   - Stage 1 spatial tests
#
# The actual world remains Cartesian internally. The future renderer can switch
# from top-down to isometric without changing simulation state.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-write
  cancel-in-progress: false

jobs:
  install-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct complete Stage 1 repository
        shell: bash
        run: |
          set -euo pipefail


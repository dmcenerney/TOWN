          base64 -d /tmp/alder-bend-stage1.b64 > /tmp/alder-bend-stage1.tgz
          tar xzf /tmp/alder-bend-stage1.tgz -C .

          echo "Stage 1 payload reconstructed."
          echo "Changed/untracked paths:"
          git status --short || true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run full test suite
        run: npm test

      - name: Run 1,000-day soak
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx tools/soak.ts --days 1000 | tee /tmp/stage1-soak.txt

          {
            echo "## Alder Bend Stage 1 verification"
            echo ""
            echo "**Typecheck:** passed"
            echo ""
            echo "**Tests:** complete Stage 1 suite passed"
            echo ""
            echo "**1,000-day soak:**"
            echo ""
            echo '```text'
            cat /tmp/stage1-soak.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push Stage 1
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "alder-bend-bot"
          git config user.email "alder-bend-bot@users.noreply.github.com"

          # Do not commit this installer itself if it was already committed by you;
          # just commit the reconstructed project changes.
          git add -A

          if git diff --cached --quiet; then
            echo "No Stage 1 project changes need committing."
          else
            git commit -m "Build Alder Bend — Stage 1: space, routing, and movement"
            git push
          fi

      - name: Installation summary
        shell: bash
        run: |
          {
            echo ""
            echo "## Stage 1 is installed"
            echo ""
            echo "Alder Bend now has:"
            echo ""
            echo "- an authored physical town"
            echo "- 27 buildings"
            echo "- a connected navigation graph"
            echo "- deterministic shortest-path routing"
            echo "- continuous movement interpolation"
            echo "- authoritative departure and arrival events"
            echo "- occupancy and anti-teleportation invariants"
            echo "- 65 passing tests"
            echo "- a verified 1,000-day headless soak"
            echo ""
            echo "### CI workflow files"
            echo ""
            echo "The three workflow sources are included at:"
            echo ""
            echo "- ci/workflows/verify.yml"
            echo "- ci/workflows/soak.yml"
            echo "- ci/workflows/unpack.yml"
            echo ""
            echo "GitHub normally prevents a workflow token from creating other workflow"
            echo "files. If those workflows are not already present under .github/workflows/,"
            echo "move/copy each one there once using the GitHub web editor."
            echo ""
            echo "### Next development stage"
            echo ""
            echo "**Stage 2 — Life & Ledger:** schedules, jobs, wages, hunger, energy,"
            echo "food, shops, business operations, and actual reasons for citizens to move."
          } >> "$GITHUB_STEP_SUMMARY"

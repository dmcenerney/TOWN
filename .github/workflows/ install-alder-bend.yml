name: install Alder Bend

# ONE FILE. Everything TOWN needs is embedded below.
#
#   1. Upload this file to .github/workflows/ in your repository
#   2. Settings -> Actions -> General -> Workflow permissions -> Read and write
#   3. Actions -> "install Alder Bend" -> Run workflow
#
# It writes 34 files, runs the full test suite and a thousand simulated
# days to prove they work, then deletes itself. Nothing to paste, nothing to
# unzip, no terminal required.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-write
  cancel-in-progress: false

